name: Publish Snapshot

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Ensure snapshot version
        run: |
          VERSION="$(./gradlew properties -q | awk '/^version:/ { print $2 }')"
          case "$VERSION" in
            *-SNAPSHOT) ;;
            *) echo "main publishes snapshots only, got $VERSION"; exit 1 ;;
          esac

      - name: Publish snapshot
        run: ./gradlew --no-daemon publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
