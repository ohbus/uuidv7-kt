name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Java ${{ matrix.test-java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-java: [ '8', '11', '17', '21' ]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.test-java }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ./gradlew --no-daemon clean check -PtestJavaVersion=${{ matrix.test-java }}
