name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail

          VERSION="$(./gradlew properties -q | awk '/^version:/ { print $2 }')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Gradle version $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Release version cannot be SNAPSHOT"
            exit 1
          fi

          git fetch --tags --force
          PREVIOUS_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"

          if [[ -z "$PREVIOUS_TAG" ]]; then
            if [[ "$TAG_VERSION" != "0.0.1" ]]; then
              echo "First release must be v0.0.1, got $GITHUB_REF_NAME"
              exit 1
            fi
          else
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
            IFS='.' read -r PREVIOUS_MAJOR PREVIOUS_MINOR PREVIOUS_PATCH <<< "$PREVIOUS_VERSION"

            VALID_PATCH=false
            VALID_MINOR=false
            VALID_MAJOR=false

            if (( MAJOR == PREVIOUS_MAJOR && MINOR == PREVIOUS_MINOR && PATCH == PREVIOUS_PATCH + 1 )); then
              VALID_PATCH=true
            fi

            if (( MAJOR == PREVIOUS_MAJOR && MINOR == PREVIOUS_MINOR + 1 && PATCH == 0 )); then
              VALID_MINOR=true
            fi

            if (( MAJOR == PREVIOUS_MAJOR + 1 && MINOR == 0 && PATCH == 0 )); then
              VALID_MAJOR=true
            fi

            if [[ "$VALID_PATCH" != "true" && "$VALID_MINOR" != "true" && "$VALID_MAJOR" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME must be one major, minor, or patch increment after $PREVIOUS_TAG"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  publish-github-packages:
    runs-on: ubuntu-latest
    needs: validate-release-version

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and publish to GitHub Packages
        run: ./gradlew --no-daemon clean check publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: validate-release-version
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish and release to Maven Central
        run: ./gradlew --no-daemon publishAndReleaseToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ''

  github-release:
    runs-on: ubuntu-latest
    needs:
      - validate-release-version
      - publish-github-packages
      - publish-maven-central

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Create assets
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate-release-version.outputs.version }}"
          ./gradlew --no-daemon clean assemble dokkaJavadocJar generatePomFileForMavenPublication

          mkdir -p dist
          cp build/libs/uuidv7-kt-${VERSION}.jar dist/
          cp build/libs/uuidv7-kt-${VERSION}-sources.jar dist/
          cp build/libs/uuidv7-kt-${VERSION}-javadoc.jar dist/
          cp build/publications/maven/pom-default.xml dist/uuidv7-kt-${VERSION}.pom
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "uuidv7-kt ${{ needs.validate-release-version.outputs.version }}" \
            --generate-notes
