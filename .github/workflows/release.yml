name: Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name/version, for example v0.0.1'
        required: true
        type: string
      publish_github_packages:
        description: 'Publish this version to GitHub Packages. Disable only when retrying after it already published.'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.release_name }}
  cancel-in-progress: false

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_name: ${{ steps.version.outputs.release_name }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate release input
        id: version
        env:
          RELEASE_NAME: ${{ inputs.release_name }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release name must match vX.Y.Z, got $RELEASE_NAME"
            exit 1
          fi

          VERSION="$(./gradlew properties -q | awk '/^version:/ { print $2 }')"
          TAG_VERSION="${RELEASE_NAME#v}"

          if [[ "$VERSION" != "$TAG_VERSION" ]]; then
            echo "Release name $RELEASE_NAME does not match Gradle version $VERSION"
            exit 1
          fi

          if [[ "$VERSION" == *-SNAPSHOT ]]; then
            echo "Release version cannot be SNAPSHOT"
            exit 1
          fi

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${RELEASE_NAME}" >/dev/null; then
            echo "Release tag $RELEASE_NAME already exists; published versions are immutable"
            exit 1
          fi

          PREVIOUS_TAG="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG_VERSION"

          if [[ -z "$PREVIOUS_TAG" ]]; then
            if [[ "$TAG_VERSION" != "0.0.1" ]]; then
              echo "First release must be v0.0.1, got $RELEASE_NAME"
              exit 1
            fi
          else
            PREVIOUS_VERSION="${PREVIOUS_TAG#v}"
            IFS='.' read -r PREVIOUS_MAJOR PREVIOUS_MINOR PREVIOUS_PATCH <<< "$PREVIOUS_VERSION"

            VALID_PATCH=false
            VALID_MINOR=false
            VALID_MAJOR=false

            if (( MAJOR == PREVIOUS_MAJOR && MINOR == PREVIOUS_MINOR && PATCH == PREVIOUS_PATCH + 1 )); then
              VALID_PATCH=true
            fi

            if (( MAJOR == PREVIOUS_MAJOR && MINOR == PREVIOUS_MINOR + 1 && PATCH == 0 )); then
              VALID_MINOR=true
            fi

            if (( MAJOR == PREVIOUS_MAJOR + 1 && MINOR == 0 && PATCH == 0 )); then
              VALID_MAJOR=true
            fi

            if [[ "$VALID_PATCH" != "true" && "$VALID_MINOR" != "true" && "$VALID_MAJOR" != "true" ]]; then
              echo "Release $RELEASE_NAME must be one major, minor, or patch increment after $PREVIOUS_TAG"
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"

  publish-github-packages:
    runs-on: ubuntu-latest
    needs: validate-release-version
    if: ${{ inputs.publish_github_packages }}
    environment:
      name: github-packages
      url: https://github.com/ohbus/uuidv7-kt/packages

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and publish to GitHub Packages
        run: ./gradlew --no-daemon clean check publishAllPublicationsToGitHubPackagesRepository
        env:
          RELEASE_NAME: ${{ needs.validate-release-version.outputs.release_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: validate-release-version
    environment:
      name: maven-central
      url: https://central.sonatype.com/publishing/deployments

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Normalize signing password
        id: signing
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${SIGNING_PASSWORD//[[:space:]]/}" ]]; then
            echo "password=" >> "$GITHUB_OUTPUT"
          else
            {
              echo "password<<EOF"
              echo "$SIGNING_PASSWORD"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Publish and release to Maven Central
        run: ./gradlew --no-daemon publishAndReleaseToMavenCentral
        env:
          RELEASE_NAME: ${{ needs.validate-release-version.outputs.release_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ steps.signing.outputs.password }}

  github-release:
    runs-on: ubuntu-latest
    needs:
      - validate-release-version
      - publish-github-packages
      - publish-maven-central
    if: ${{ always() && needs.validate-release-version.result == 'success' && needs.publish-maven-central.result == 'success' && (needs.publish-github-packages.result == 'success' || needs.publish-github-packages.result == 'skipped') }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Create assets
        env:
          RELEASE_NAME: ${{ needs.validate-release-version.outputs.release_name }}
        run: |
          set -euo pipefail

          VERSION="${{ needs.validate-release-version.outputs.version }}"
          ./gradlew --no-daemon clean assemble dokkaJavadocJar generatePomFileForMavenPublication

          mkdir -p dist
          cp build/libs/uuidv7-kt-${VERSION}.jar dist/
          cp build/libs/uuidv7-kt-${VERSION}-sources.jar dist/
          cp build/libs/uuidv7-kt-${VERSION}-javadoc.jar dist/
          cp build/publications/maven/pom-default.xml dist/uuidv7-kt-${VERSION}.pom
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create release tag
        env:
          RELEASE_NAME: ${{ needs.validate-release-version.outputs.release_name }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_NAME"
          git push origin "$RELEASE_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ needs.validate-release-version.outputs.release_name }}
        run: |
          gh release create "$RELEASE_NAME" dist/* \
            --title "uuidv7-kt ${{ needs.validate-release-version.outputs.version }}" \
            --generate-notes
